name: Android APK Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.9-english.1
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_demoSigning: 'true'
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    defaults:
      run:
        working-directory: alloop-SDK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch 3.47.3 https://github.com/flutter/flutter.git flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          ./flutter/bin/flutter --version
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check English interface and doctor integration
        run: >-
          flutter test test/native_english_render_test.dart
          test/doctor_native_integration_test.dart
          test/device_center_localization_test.dart
          test/care_english_regression_test.dart
          test/medical_ocr_service_test.dart
      - name: Build installable release APK
        run: >-
          flutter build apk --release --target lib/main.dart
          --target-platform android-arm,android-arm64,android-x64
          --build-number 11
          --dart-define=DOCTOR_API_BASE=https://vvewell-web-preview-357361255240.asia-east1.run.app
      - name: Prepare release asset
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/vvewell-1.0.9-english.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs release/vvewell-1.0.9-english.apk
          sha256sum release/vvewell-1.0.9-english.apk > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: alloop-SDK/release/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify app starts on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: alloop-SDK
          script: |
            adb install -r release/vvewell-1.0.9-english.apk
            adb shell am start -W -n com.alloop.blue.test/.MainActivity
            sleep 20
            adb shell dumpsys activity activities > release/activity.txt
            grep -E 'mResumedActivity:.*com.alloop.blue.test|topResumedActivity=.*com.alloop.blue.test' release/activity.txt
            adb exec-out screencap -p > release/android-startup.png
            adb logcat -d > release/logcat.txt
            if grep -q 'FATAL EXCEPTION' release/logcat.txt; then exit 1; fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release/notes.md <<'NOTES'
          English Android demo with integrated Find a doctor chat and the 878-doctor backend.

          - English is the default language, including native rPPG measurement screens.
          - Universal APK for ARM, ARM64 and x86_64; Android 9 or newer.
          - Built in release mode and signed with an Android debug certificate for demo installation.
          - Automated English UI checks, doctor integration tests and Android startup check passed.
          - Bluetooth rings, radar, thermal camera and other real hardware were not validated in CI. Cloud account sync requires separate configuration.
          NOTES
          gh release create "$RELEASE_TAG" release/vvewell-1.0.9-english.apk release/SHA256SUMS.txt release/android-startup.png --target "$GITHUB_SHA" --title 'Vvewell 1.0.9 — English Android APK' --notes-file release/notes.md
