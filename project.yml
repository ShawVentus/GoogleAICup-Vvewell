name: vvewell-app-ios
options:
  bundleIdPrefix: com.vvewell
  deploymentTarget:
    iOS: "13.0"
  xcodeVersion: "15.3"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: "DRXYY4GSNL"

schemes:
  vvewell-app-ios:
    build:
      targets:
        vvewell-app-ios: all
    archive:
      config: Release
  vvewell-app-ios-sim:
    build:
      targets:
        vvewell-app-ios-sim: all
    test:
      targets:
        - vvewell-app-ios-tests

targets:
  vvewell-app-ios:
    type: application
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
        excludes:
          - "Frameworks/**"
          - "Simulator/**"
          - "Resources/rppg_model.mlpackage/**"
          - "Resources/rppg_model.mlpackage"
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/AvatarCoach
        buildPhase: resources
      - path: Sources/Resources/rppg_model.mlmodelc
        buildPhase: resources
      - path: RelayConfig.plist
        buildPhase: resources
    dependencies:
      - framework: Sources/Frameworks/RingSDK.framework
        embed: true
      - framework: Sources/Frameworks/EiotGluSdk.framework
        embed: true
      - framework: Sources/Frameworks/AB_FOTA.framework
        embed: true
      - sdk: CoreBluetooth.framework
      - sdk: HealthKit.framework
      - sdk: VideoToolbox.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: OpenGLES.framework
      - sdk: CoreImage.framework
      - sdk: Vision.framework
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: VvewellGlobal
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "4"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default Configuration"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        UILaunchStoryboardName: ""
        UILaunchScreen:
          UIColorName: ""
        CFBundleIconName: AppIcon
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIDeviceFamily:
          - 1
        NSBluetoothAlwaysUsageDescription: "需要蓝牙权限以连接戒指设备"
        NSBluetoothPeripheralUsageDescription: "需要蓝牙权限以连接戒指设备"
        NSHealthShareUsageDescription: "读取您的步数、卡路里和运动距离等健康数据，以展示今日活动概览"
        NSMotionUsageDescription: "Used to count steps and distance during sport tracking"
        NSCameraUsageDescription: "用于 rPPG 健康检测，需录制 60 秒面部视频以分析心率等指标"
        NSMicrophoneUsageDescription: "录制健康检测视频时需要麦克风权限"
        NSPhotoLibraryUsageDescription: "开发模式：从相册选取测试视频"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        API_BASE_URL: "http://127.0.0.1:8000"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vvewell.app
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_APP_INTENTS_METADATA: NO
        OTHER_LDFLAGS:
          - -ObjC
          - -lz
          - -lsqlite3
      configs:
        Debug:
          INFOPLIST_FILE: Sources/Info.Debug.plist
  vvewell-app-ios-sim:
    type: application
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
        excludes:
          - "Frameworks/**"
          - "Devices/Ring/**"
          - "Devices/ThermalCamera/**"
          - "Resources/rppg_model.mlpackage/**"
          - "Resources/rppg_model.mlpackage"
          - "Views/RingCheckViewController.swift"
          - "Views/RingDetailViewController.swift"
          - "Views/ECGCheckViewController.swift"
          - "Views/GlucoseCheckViewController.swift"
          - "Views/EmotionCheckViewController.swift"
          - "Views/SportViewController.swift"
          - "Views/ThermalCameraViewController.swift"
          - "Views/ThermalColorBarView.swift"
          - "Views/RespiratoryWaveformView.swift"
      - path: Sources/Simulator
    resources:
      - path: Resources
      - path: RelayConfig.plist
    dependencies:
      - sdk: CoreBluetooth.framework
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Vvewell Sim
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "4"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default Configuration"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        UILaunchStoryboardName: ""
        UILaunchScreen:
          UIColorName: ""
        CFBundleIconName: AppIcon
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIDeviceFamily:
          - 1
        NSBluetoothAlwaysUsageDescription: "需要蓝牙权限以连接戒指设备"
        NSBluetoothPeripheralUsageDescription: "需要蓝牙权限以连接戒指设备"
        NSMotionUsageDescription: "Used to count steps and distance during sport tracking"
        NSCameraUsageDescription: "用于 rPPG 健康检测，需录制 60 秒面部视频以分析心率等指标"
        NSMicrophoneUsageDescription: "录制健康检测视频时需要麦克风权限"
        NSPhotoLibraryUsageDescription: "开发模式：从相册选取测试视频"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        API_BASE_URL: "http://127.0.0.1:8000"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vvewell.app.sim
        INFOPLIST_FILE: Sources/Info.plist
      configs:
        Debug:
          INFOPLIST_FILE: Sources/Info.Debug.plist
  vvewell-app-ios-tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - path: tests/ralph
    dependencies:
      - target: vvewell-app-ios-sim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vvewell.app.tests
        GENERATE_INFOPLIST_FILE: YES
