group = "com.alloop.aizoring_blue_lite"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        flatDir {
            dirs "${projectDir}/libs"
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.alloop.aizoring_blue_lite"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
        main.jniLibs.srcDirs += "src/main/jniLibs"
    }

    defaultConfig {
        minSdk = 26
    }

    dependencies {
        // AIZORING SDK AARs
        api(name: "aizo_sdk_release_v2.1.1", ext: "aar")
        api(name: "aizo_be_lib_release_v2.1.0", ext: "aar")
        api(name: "aizo_serversdk_release_v2_2.2.4", ext: "aar")
        api(name: "ECGSDK-0.3.7", ext: "aar")
        api(name: "fota-1.4.3-release", ext: "aar")

        // Realtek BLE libraries
        api(files("libs/rtk-core-1.6.9.jar"))
        api(files("libs/rtk-dfu-3.12.32.jar"))

        // Transitive dependencies required by AIZORING SDK
        implementation("androidx.appcompat:appcompat:1.2.0")
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.2")
        implementation("com.alibaba:fastjson:1.1.72.android")
        implementation("com.squareup.moshi:moshi-kotlin:1.13.0")
        // Tencent MMKV — required by AIZORING SDK's LocalSave
        implementation("com.tencent:mmkv:1.3.1")
        // Serialize — required by AIZORING SDK's LocalSave (SerialLazyDelegate)
        // Exclude its bundled mmkv-static to avoid conflict with mmkv above
        implementation("com.github.liangjingkanji:Serialize:1.3.1") {
            exclude group: "com.tencent", module: "mmkv-static"
        }
        // Gson — required by AIZORING SDK's init coroutine (TypeToken)
        implementation("com.google.code.gson:gson:2.9.0")

        testImplementation("org.jetbrains.kotlin:kotlin-test")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}
