<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shenzhen Care Finder</title>
<style>
:root{--bg:#f4f6fb;--ink:#14202e;--mut:#5b6b80;--glass:rgba(255,255,255,.72);--line:rgba(20,32,46,.10);--acc:#0b7a6a;--acc2:#3b6cf6;--accbg:rgba(11,122,106,.10);--warn:#8a1c1c;--warnbg:#fdecec;--me:#dfe9ff;--shadow:0 10px 40px rgba(30,50,90,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#0c1118;--ink:#e8eef6;--mut:#93a3b8;--glass:rgba(24,32,44,.72);--line:rgba(255,255,255,.09);--acc:#4fd1b8;--acc2:#7ea2ff;--accbg:rgba(79,209,184,.12);--warn:#ffb4b4;--warnbg:#3a1d1d;--me:#22325a;--shadow:0 10px 40px rgba(0,0,0,.45)}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#2dd4bf;left:-15vmax;top:-20vmax}
.aurora i:nth-child(2){background:#6366f1;right:-18vmax;top:10vmax;animation-delay:-8s}
.aurora i:nth-child(3){background:#38bdf8;left:20vmax;bottom:-30vmax;animation-delay:-14s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.app{max-width:780px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:20px 16px 0}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:var(--shadow)}
h1{font-size:1.25rem;margin:0;line-height:1.2}.sub{margin:0;color:var(--mut);font-size:.88rem}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}.toggle span{white-space:nowrap}@media(max-width:560px){header{flex-wrap:wrap}.hdr-right{width:100%;justify-content:space-between}.sub{display:none}}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.profile{padding:12px 14px;display:grid;grid-template-columns:120px .8fr 1.1fr 1fr 1.6fr;gap:10px;align-items:end}
@media(max-width:700px){.profile{grid-template-columns:1fr 1fr}.profile .wide{grid-column:1/-1}}
.profile label{display:block;font-size:.72rem;font-weight:600;color:var(--mut);margin:0 0 3px;text-transform:uppercase;letter-spacing:.04em}
select,input,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:.95rem}
select option{color:#000}
.bad{border-color:#e5484d!important;box-shadow:0 0 0 3px rgba(229,72,77,.18)}
#stage{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px 2px 190px}
.hello{text-align:center;color:var(--mut);margin:36px 0 8px}.hello h2{color:var(--ink);font-size:1.6rem;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:8px 12px;border-radius:999px;font-size:.88rem;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.msg{padding:12px 15px;border-radius:18px;max-width:92%;white-space:pre-wrap;word-wrap:break-word;animation:pop .28s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.me{background:var(--me);align-self:flex-end;border-bottom-right-radius:6px}
.bot{background:var(--glass);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px;box-shadow:var(--shadow);width:100%;max-width:100%}
.bot.q{width:auto;max-width:92%}
.urgent{background:rgba(245,158,11,.15);border:1px solid #f59e0b;color:var(--ink);align-self:stretch;font-weight:600}
.emerg{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);font-weight:600;align-self:stretch}
.dots{display:inline-flex;gap:5px;vertical-align:middle}.dots b{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:bl 1.1s infinite}.dots b:nth-child(2){animation-delay:.18s}.dots b:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
.intro{margin:0 0 10px}.hosp{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--accbg);animation:pop .4s ease both}
.hosp h3{margin:0 0 6px;font-size:1rem;display:flex;gap:8px;align-items:baseline}.rank{flex:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:.8rem;display:grid;place-items:center}
.hosp ul{margin:0;padding-left:18px;font-size:.93rem}.hosp li{margin:2px 0}.foot{color:var(--mut);font-size:.82rem;margin-top:6px}
.speak{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer;margin-top:6px}
button{font:inherit;cursor:pointer}
.btn{padding:9px 14px;border-radius:12px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-weight:600}
.toggle{display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--mut);cursor:pointer;user-select:none}
.toggle input{width:auto;accent-color:var(--acc)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%)}
.dock-in{max-width:780px;margin:0 auto}
.live{min-height:24px;text-align:center;color:var(--mut);font-size:.95rem;margin-bottom:6px;font-style:italic}
.live.on{color:var(--ink)}
.composer{display:flex;gap:10px;align-items:center;padding:8px}
.composer input{border:0;background:transparent;flex:1;padding:10px 8px;outline:none}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--acc2);color:#fff;font-size:18px;flex:none}
.send:disabled,.mic:disabled{opacity:.5;cursor:not-allowed}
.mic{position:relative;width:56px;height:56px;border-radius:50%;border:0;color:#fff;font-size:24px;flex:none;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 22px rgba(59,108,246,.4);transition:transform .15s}
.mic:active{transform:scale(.94)}
.mic::before,.mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc2);opacity:0}
.mic.listening::before{animation:ring 1.6s infinite}.mic.listening::after{animation:ring 1.6s .8s infinite}
@keyframes ring{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.9)}}
.mic.listening{background:linear-gradient(135deg,#ef4444,#f97316)}
.mic.speaking{animation:breathe 1.2s ease-in-out infinite}.mic.thinking{opacity:.75}
@keyframes breathe{50%{transform:scale(1.1)}}
#wave{width:64px;height:30px;flex:none}
.note{font-size:.72rem;color:var(--mut);text-align:center;margin:8px 0 0}
.err{color:var(--warn);font-size:.85rem;text-align:center}
</style></head><body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="app">
<header><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></div><div><h1 data-t="title">Shenzhen Care Finder</h1><p class="sub" data-t="sub"></p></div>
<div class="hdr-right"><label class="toggle"><input type="checkbox" id="voiceMode" checked><span data-t="voiceMode"></span></label><button class="btn" id="restart" data-t="restart"></button></div></header>

<section class="glass profile" id="profile">
<div class="wide"><label data-t="lang"></label><select id="lang"><option value="en">English</option><option value="zh">中文</option></select></div>
<div><label for="age" data-t="age"></label><input id="age" type="number" min="0" max="120" inputmode="numeric"></div>
<div><label for="sex" data-t="sex"></label><select id="sex"><option value="" data-t="select"></option><option value="F" data-t="female"></option><option value="M" data-t="male"></option><option value="unknown" data-t="nosay"></option></select></div>
<div><label for="country" data-t="country"></label><input id="country" value="US"></div>
<div class="wide"><label for="intent" data-t="intent"></label><select id="intent"><option value="undecided" data-t="i1"></option><option value="confirmed_dx" data-t="i2"></option><option value="other" data-t="i3"></option></select></div>
</section>

<div id="stage" aria-live="polite">
<div class="hello" id="hello"><h2 data-t="hi"></h2><div data-t="hiSub"></div><div class="chips" id="chips"></div></div>
</div>
</div>

<div class="dock"><div class="dock-in">
<div class="live" id="live"></div>
<div class="glass composer">
<input id="txt" autocomplete="off" maxlength="4000">
<canvas id="wave" width="128" height="60" hidden></canvas>
<button class="mic" id="mic" type="button" aria-label="Voice input"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<button class="send" id="send" type="button" aria-label="Send">&#10148;</button>
</div>
<p class="note" data-t="note"></p>
</div></div>

<script>
const T={
en:{title:'Shenzhen Care Finder',sub:'Tell us what is going on — by voice or text. We suggest the department and Shenzhen hospitals. Not a diagnosis.',voiceMode:'Voice replies',restart:'New chat',lang:'Language',age:'Age',sex:'Sex at birth',select:'Select…',female:'Female',male:'Male',nosay:'Prefer not to say',country:'Country',intent:'Need',i1:'Not sure which doctor',i2:'Diagnosed; treatment / 2nd opinion',i3:'Something else',hi:'How can we help?',hiSub:'Set age and sex above, then tap the mic and just talk.',ph:'Type, or tap the mic and speak…',listening:'Listening… speak now',thinking:'Analyzing…',slow:'Analyzing… (can take up to a minute)',noSpeech:'Voice input is not supported in this browser (try Chrome, Edge or Safari). You can type instead.',micDenied:'Microphone blocked. Allow microphone access for this page, or type instead.',needProfile:'Please fill in age and sex first (the highlighted boxes).',net:'Network error. Please try again.',again:'Say it again',speakIt:'🔊 Read aloud',stop:'⏹ Stop',note:'For reference only; does not replace a doctor. A care coordinator confirms availability. Emergency: 911 (U.S.) / 120 (mainland China).',tryS:['I\'m 38, heavy periods for a year, ultrasound showed fibroids','My 8 year old is getting more nearsighted every year','Diagnosed with stage II lung cancer, want a second opinion'],sp:'en-US',noDept:'We could not determine a department.',insecure:'Voice needs https or localhost.'},
zh:{title:'深圳就医助手',sub:'用语音或文字告诉我们情况，我们建议挂什么科、去深圳哪几家医院。不是诊断。',voiceMode:'语音播报',restart:'新对话',lang:'语言',age:'年龄',sex:'出生性别',select:'请选择…',female:'女',male:'男',nosay:'不愿透露',country:'居住国家',intent:'需求',i1:'不确定看什么科',i2:'已确诊，想治疗/二诊',i3:'其他',hi:'有什么可以帮您？',hiSub:'先在上方填好年龄和性别，然后点麦克风直接说话。',ph:'输入文字，或点麦克风说话…',listening:'正在听…请说话',thinking:'分析中…',slow:'分析中…（可能需要一分钟）',noSpeech:'此浏览器不支持语音输入（请用 Chrome、Edge 或 Safari），您可以直接打字。',micDenied:'麦克风被禁用。请允许本页使用麦克风，或直接打字。',needProfile:'请先填写年龄和出生性别（标红的框）。',net:'网络错误，请重试。',again:'再说一次',speakIt:'🔊 朗读',stop:'⏹ 停止',note:'仅供参考，不能代替医生；顾问会确认可预约情况。急症：美国 911 / 中国内地 120。',tryS:['我右膝盖疼了半年，上下楼梯更疼，美国医生说是半月板损伤','最近半年焦虑，晚上失眠，白天心慌','确诊了肺腺癌，想了解治疗方案'],sp:'zh-CN',noDept:'暂时无法判断科室。',insecure:'语音需要 https 或 localhost。'}
};
const $=id=>document.getElementById(id);
const stage=$('stage'),txt=$('txt'),mic=$('mic'),live=$('live');
let urgentShown=false,L='en',base=null,qa=[],pendingQ=null,busy=false,rec=null,listening=false,speaking=false,finalText='',silenceT=null,wantMic=false;
const t=k=>T[L][k];
function applyLang(){L=$('lang').value;document.documentElement.lang=L;
  document.querySelectorAll('[data-t]').forEach(e=>{const v=T[L][e.dataset.t];if(v!==undefined)e.textContent=v});
  txt.placeholder=t('ph');
  if($('chips')){$('chips').innerHTML='';t('tryS').forEach(s=>{const c=document.createElement('button');c.className='chip';c.type='button';c.textContent=s;c.onclick=()=>{txt.value=s;submitText(s)};$('chips').appendChild(c)})}}
$('lang').onchange=()=>{stopAll();applyLang()};applyLang();
$('lang').value=(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en';applyLang();

function add(cls,node){$('hello')&&$('hello').remove();const d=document.createElement('div');d.className='msg '+cls;if(typeof node==='string')d.textContent=node;else d.appendChild(node);stage.appendChild(d);d.scrollIntoView({block:'end',behavior:'smooth'});return d}
function render(msg){const box=document.createElement('div');let ul=null;
  for(const raw of msg.split('\n')){const l=raw.replace(/\s+$/,'');if(!l.trim())continue;let m;
    if((m=l.match(/^(\d+)\.\s+(.*)$/))){const card=document.createElement('div');card.className='hosp';card.style.animationDelay=(m[1]*0.12)+'s';const h=document.createElement('h3');const r=document.createElement('span');r.className='rank';r.textContent=m[1];h.appendChild(r);h.appendChild(document.createTextNode(m[2]));card.appendChild(h);ul=document.createElement('ul');card.appendChild(ul);box.appendChild(card)}
    else if(/^\s*[•·]\s/.test(l)&&ul){const li=document.createElement('li');li.textContent=l.replace(/^\s*[•·]\s*/,'');ul.appendChild(li)}
    else if(/^(About these hospital types|For reference only|仅供参考)/.test(l.trim())||/^\s*[•·]/.test(l)){const p=document.createElement('div');p.className='foot';p.textContent=l.replace(/^\s*[•·]\s*/,'• ');box.appendChild(p);ul=null}
    else{const p=document.createElement('p');p.className='intro';p.textContent=l.trim();box.appendChild(p)}}
  return box}

// ---------- 语音输出（TTS）
let voices=[];const loadVoices=()=>{voices=speechSynthesis.getVoices()};if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,then){
  if(!('speechSynthesis' in window)||!text){then&&then();return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/\s+/g,' '));u.lang=t('sp');
  const v=voices.find(v=>v.lang===u.lang)||voices.find(v=>v.lang.startsWith(u.lang.slice(0,2)));if(v)u.voice=v;u.rate=1.02;
  u.onstart=()=>{speaking=true;setState()};const done=()=>{speaking=false;setState();then&&then()};u.onend=done;u.onerror=done;speechSynthesis.speak(u)}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel();speaking=false}

// ---------- 语音输入（STT，实时转写）+ 声波
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let aCtx=null,aStream=null,raf=null;
async function startWave(){try{aStream=await navigator.mediaDevices.getUserMedia({audio:true});aCtx=new (window.AudioContext||window.webkitAudioContext)();const an=aCtx.createAnalyser();an.fftSize=64;aCtx.createMediaStreamSource(aStream).connect(an);
  const cv=$('wave'),g=cv.getContext('2d'),buf=new Uint8Array(an.frequencyBinCount);cv.hidden=false;
  const col=getComputedStyle(document.documentElement).getPropertyValue('--acc2').trim()||'#3b6cf6';
  (function draw(){raf=requestAnimationFrame(draw);an.getByteFrequencyData(buf);g.clearRect(0,0,128,60);g.fillStyle=col;for(let i=0;i<16;i++){const h=Math.max(4,buf[i+1]/255*56);g.fillRect(i*8+1,30-h/2,5,h)}})()}catch(e){}}
function stopWave(){cancelAnimationFrame(raf);$('wave').hidden=true;try{aStream&&aStream.getTracks().forEach(x=>x.stop())}catch(e){}try{aCtx&&aCtx.close()}catch(e){}aStream=aCtx=null}
function setState(){mic.classList.toggle('listening',listening);mic.classList.toggle('speaking',speaking&&!listening);mic.classList.toggle('thinking',busy);
  live.classList.toggle('on',listening);if(listening&&!finalText&&!txt.value)live.textContent=t('listening');else if(busy)live.textContent=t('thinking');else if(!listening&&!live.dataset.keep)live.textContent=''}
function startListen(){
  if(!SR){live.textContent=t('noSpeech');return}
  if(busy||listening)return;stopSpeak();
  rec=new SR();rec.lang=t('sp');rec.continuous=true;rec.interimResults=true;finalText='';live.dataset.keep='';
  rec.onstart=()=>{listening=true;setState();startWave()};
  rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalText+=r[0].transcript;else interim+=r[0].transcript}
    txt.value=(finalText+interim).trim();live.textContent=txt.value;live.classList.add('on');
    clearTimeout(silenceT);silenceT=setTimeout(()=>{if(txt.value.trim())finishListen(true)},1700)}; // 停顿约 1.7 秒自动发送
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){live.textContent=t('micDenied');live.dataset.keep='1';location.protocol==='http:'&&!['localhost','127.0.0.1'].includes(location.hostname)&&(live.textContent+=' '+t('insecure'))}};
  rec.onend=()=>{listening=false;stopWave();clearTimeout(silenceT);setState()};
  try{rec.start()}catch(e){}}
function finishListen(send){clearTimeout(silenceT);try{rec&&rec.stop()}catch(e){}listening=false;stopWave();setState();if(send)submitText(txt.value.trim())}
function stopAll(){clearTimeout(silenceT);try{rec&&rec.abort()}catch(e){}listening=false;stopWave();stopSpeak();setState()}
mic.onclick=()=>{if(listening){finishListen(!!txt.value.trim())}else{if(speaking)stopSpeak();startListen()}};
if(!SR){mic.title=t('noSpeech')}

// ---------- 对话
function profileOK(){let ok=true;for(const id of['age','sex']){const e=$(id),bad=!e.value;e.classList.toggle('bad',bad);if(bad)ok=false}return ok}
['age','sex'].forEach(id=>$(id).addEventListener('input',()=>$(id).classList.remove('bad')));
function submitText(s){
  s=(s||'').trim();if(!s||busy)return;stopAll();
  if(pendingQ){qa.push({q:pendingQ,a:s});add('me',s);txt.value='';ask();return}
  if(!profileOK()){live.textContent=t('needProfile');live.dataset.keep='1';$('profile').scrollIntoView({behavior:'smooth'});return}
  live.dataset.keep='';
  base={text:s,age:$('age').value,sex_at_birth:$('sex').value,current_country:$('country').value||'US',intent:$('intent').value,reply_language:L};qa=[];
  add('me',s);txt.value='';ask()}
async function ask(){
  busy=true;$('send').disabled=true;mic.disabled=false;setState();
  const wait=add('bot q','');wait.innerHTML='<span class="dots"><b></b><b></b><b></b></span> ';wait.append(t('slow'));
  const body={...base};if(qa.length)body.followup_answers=qa.map(x=>'Q: '+x.q+'\nA: '+x.a).join('\n');
  let d,ok=false;
  try{const r=await fetch('/api/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});d=await r.json();ok=r.ok}catch(e){d={error:t('net')}}
  wait.remove();pendingQ=null;busy=false;$('send').disabled=false;setState();
  if(ok&&d.urgent_notice&&!urgentShown){urgentShown=true;add('urgent','⚠ '+d.urgent_notice);if($('voiceMode').checked)speak(d.urgent_notice)}
  const voice=$('voiceMode').checked;
  if(!ok){const m=add('emerg',d.error||'Something went wrong.');voice&&speak(d.error)}
  else if(d.type==='emergency'){add('emerg',d.message);voice&&speak(d.message)}
  else if(d.type==='followup'){pendingQ=d.question;add('bot q',d.question);txt.placeholder=t('ph');
    if(voice)speak(d.question,()=>{if(pendingQ&&SR)startListen()}) // 说完问题自动开麦，等待回答
    else if(SR)startListen()}
  else if(d.type==='no_department'){const m=d.message||t('noDept');add('bot q',m);voice&&speak(m)}
  else{const box=render(d.message||'');if(d.intro){const p=document.createElement('p');p.className='intro';p.textContent=d.intro;box.insertBefore(p,box.firstChild)}
    const spoken=d.intro||(d.message||'').split('\n')[0];
    const b=document.createElement('button');b.className='speak';b.type='button';b.textContent=t('speakIt');b.onclick=()=>{if(speaking){stopSpeak();b.textContent=t('speakIt');return}b.textContent=t('stop');speak(summaryText(d),()=>b.textContent=t('speakIt'))};box.appendChild(b);
    add('bot',box);voice&&speak(spoken)}}
function summaryText(d){return[d.intro||'',...(d.message||'').split('\n').filter(l=>/^\d+\.\s/.test(l)).map(l=>l.replace(/^\d+\.\s/,''))].join('. ')}
$('send').onclick=()=>submitText(txt.value);
